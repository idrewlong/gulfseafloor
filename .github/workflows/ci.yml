name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test ./...

  web-build:
    runs-on: ubuntu-latest
    if: hashFiles('web/package.json') != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci && build
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        run: syft . -o spdx-json=sbom.spdx.json
      - name: Vulnerability scan
        run: grype sbom:sbom.spdx.json --fail-on high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.spdx.json

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.GITHUB_TOKEN != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:0.1.0
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    runs-on: ubuntu-latest
    needs: [image, sbom-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - uses: sigstore/cosign-installer@v4
      - name: Sign and attest
        env:
          COSIGN_YES: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY}" ]; then
            cosign sign --key env://COSIGN_PRIVATE_KEY "${IMAGE}"
            cosign attest --key env://COSIGN_PRIVATE_KEY --predicate sbom.spdx.json --type spdxjson "${IMAGE}"
          else
            # Keyless (GitHub OIDC). Skip cleanly if the identity provider is unavailable.
            if cosign sign "${IMAGE}"; then
              cosign attest --predicate sbom.spdx.json --type spdxjson "${IMAGE}"
            else
              echo "cosign keyless sign skipped (no key, OIDC failed)"
            fi
          fi
