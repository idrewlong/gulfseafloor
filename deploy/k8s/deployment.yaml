apiVersion: apps/v1
kind: Deployment
metadata:
  name: gulf-viewer
  labels:
    app.kubernetes.io/name: gulf-viewer
    app.kubernetes.io/part-of: gulfseafloor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gulf-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gulf-viewer
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gulf-viewer
          image: ghcr.io/idrewlong/gulfseafloor:0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GULF_ADDR
              value: ":8080"
            - name: GULF_TILE_DIR
              value: /data/tiles
            - name: LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tiles
              mountPath: /data/tiles
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tiles
          emptyDir: {}
        - name: tmp
          emptyDir: {}
