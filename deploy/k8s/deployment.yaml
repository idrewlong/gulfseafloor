apiVersion: apps/v1
kind: Deployment
metadata:
  name: gulf-viewer
  labels:
    app.kubernetes.io/name: gulf-viewer
    app.kubernetes.io/part-of: gulfseafloor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gulf-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gulf-viewer
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gulf-viewer
          image: ghcr.io/idrewlong/gulfseafloor:0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GULF_ADDR
              value: ":8080"
            - name: GULF_TILE_DIR
              value: /data/tiles
            # The ocean layers write their snapshots through to disk before
            # publishing. The root filesystem is read-only, so this must name
            # a mounted volume — left at its default it resolved to
            # /data/ocean on the read-only root and every write-through
            # failed.
            - name: GULF_OCEAN_DIR
              value: /data/ocean
            - name: LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # /data/tiles is deliberately NOT a volume. It ships in the image,
            # and an emptyDir here used to mask it — the pod served a chart
            # with zero tiles because the mount hid what the image carried.
            - name: tmp
              mountPath: /tmp
            # This one IS a volume, for the opposite reason: the image
            # carries no ocean snapshot (it is gitignored and excluded from
            # the build context), so there is nothing here for a mount to
            # mask, and the refreshers need somewhere to write. emptyDir is
            # the right lifetime — a restarted pod re-fetches within a
            # minute, and the layer is not authoritative.
            #
            # An air-gapped deployment that wants this layer must instead
            # ship a seeded snapshot and point GULF_OCEAN_DIR at it with the
            # refreshers off; see docs/deployment.md.
            - name: ocean
              mountPath: /data/ocean
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ocean
          emptyDir:
            sizeLimit: 64Mi
